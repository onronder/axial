services:
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Ghost Protocol: Zero-Retention Configuration
      # These can be overridden in .env file
      - CHUNK_ENCRYPTION_KEY=${CHUNK_ENCRYPTION_KEY:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - STRICT_ENCRYPTION_MODE=${STRICT_ENCRYPTION_MODE:-true}
      - SECURE_WIPE_PASSES=${SECURE_WIPE_PASSES:-1}
      - MAX_RAM_PROCESS_LIMIT=${MAX_RAM_PROCESS_LIMIT:-10485760}
      # Skip ClamAV update on dev for faster startup
      - SKIP_FRESHCLAM=${SKIP_FRESHCLAM:-true}
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '4'
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    # Optional: Enable ClamAV for full Ghost Protocol compliance
    # Uncomment the following for production:
    # command: ["/start-with-clamav.sh"]
    # cap_add:
    #   - SYS_PTRACE  # Required for ClamAV

  flower:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    command: celery -A core.celery_app flower --port=5555
    ports:
      - "5555:5555"
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5555/api/workers"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
