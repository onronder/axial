[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = -v --tb=short

# Filter third-party deprecation warnings we can't fix
filterwarnings =
    ignore::pydantic.PydanticDeprecatedSince212
    ignore::DeprecationWarning:pyiceberg.*
    ignore::pytest.PytestConfigWarning
    ignore::DeprecationWarning:httplib2\.auth
    ignore:.*'timeout' parameter is deprecated.*:DeprecationWarning:supabase\._sync\.client
    ignore:.*'verify' parameter is deprecated.*:DeprecationWarning:supabase\._sync\.client

# Markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may require external services)
    slow: Slow tests (skip with -m "not slow")
    security: Security tests (may require external services)
    benchmark: Performance benchmarks
